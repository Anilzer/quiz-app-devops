
name: Quiz App - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build et tests JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Executer les tests
        run: npm test

      - name: Construire l'application
        run: npm run build

      - name: Archiver le resultat
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-dist
          path: dist/
          if-no-files-found: error

  sonar-analysis:
    name: Analyse SonarQube
    needs: build-and-test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Analyse SonarQube
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scanner = "C:\tools\sonar-scanner-7.2.0.5079-windows-x64\bin\sonar-scanner.bat"

          if (-not (Test-Path $scanner)) {
              throw "SonarScanner introuvable : $scanner"
          }

          & $scanner "-Dsonar.host.url=http://127.0.0.1:9000"

          if ($LASTEXITCODE -ne 0) {
              throw "Analyse SonarQube échouée : code $LASTEXITCODE"
          }
  
  docker-nexus:
    name: Docker Build - Trivy - Nexus
    needs: sonar-analysis
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        shell: powershell
        run: |
          $image = "localhost:5001/quiz-app:${{ github.run_number }}"
          docker build --pull -t $image .
          if ($LASTEXITCODE -ne 0) {
            throw "Echec du build Docker"
          }

      - name: Scanner l'image avec Trivy
        shell: powershell
        run: |
          $image = "localhost:5001/quiz-app:${{ github.run_number }}"

          docker run --rm `
            -v /var/run/docker.sock:/var/run/docker.sock `
            aquasec/trivy:0.68.2 image `
            --image-src docker `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "Trivy a detecte des vulnerabilites bloquantes ou a echoue"
          }

      
      - name: Connexion a Nexus
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          $encoding = New-Object System.Text.UTF8Encoding($false)

          [Console]::InputEncoding = $encoding
          $OutputEncoding = $encoding

          $env:NEXUS_PASSWORD | docker login 127.0.0.1:5001 `
            --username $env:NEXUS_USERNAME `
            --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Echec de connexion Nexus"
          }


      - name: Publier l'image dans Nexus
        shell: powershell
        run: |
          $image = "localhost:5001/quiz-app:${{ github.run_number }}"
          $latest = "localhost:5001/quiz-app:latest"

          docker push $image
          if ($LASTEXITCODE -ne 0) {
            throw "Echec du push de l'image versionnee"
          }

          docker tag $image $latest
          docker push $latest
          if ($LASTEXITCODE -ne 0) {
            throw "Echec du push latest"
          }

      - name: Deconnexion Nexus
        if: always()
        shell: powershell
        run: docker logout localhost:5001

