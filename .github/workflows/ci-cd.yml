
name: Quiz App - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build et tests JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Executer les tests
        run: npm test

      - name: Construire l'application
        run: npm run build

      - name: Archiver le resultat
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-dist
          path: dist/
          if-no-files-found: error

  sonar-analysis:
    name: Analyse SonarQube
    needs: build-and-test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Analyse SonarQube
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scanner = "C:\tools\sonar-scanner-7.2.0.5079-windows-x64\bin\sonar-scanner.bat"

          if (-not (Test-Path $scanner)) {
              throw "SonarScanner introuvable : $scanner"
          }

          & $scanner "-Dsonar.host.url=http://127.0.0.1:9000"

          if ($LASTEXITCODE -ne 0) {
              throw "Analyse SonarQube échouée : code $LASTEXITCODE"
          }
